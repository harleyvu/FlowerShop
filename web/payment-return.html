<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kết quả thanh toán</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
      padding: 24px;
      background: #f6faf7;
      color: #203a2f;
      text-align: center;
    }
    .card {
      max-width: 720px;
      margin: 28px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    .status { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .ok { color: #27c16b; font-weight: 800; }
    .bad { color: #ff6b6b; font-weight: 800; }
    pre {
      background: #f0f4f2;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      text-align: left;
    }
    .actions { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer; font-size: 1em; }
    .btn-primary { background: #27c16b; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid #e6eee9; }
    .muted { color: #6b8f80; }
  </style>
</head>
<body>
  <div class="card">
    <div id="root">
      <h2>Đang xử lý thanh toán...</h2>
    </div>
  </div>

  <script>
    // Parse URL parameters
    function parseQuery() {
      const qs = location.search.substring(1);
      const pairs = qs.split("&");
      const result = {};
      for (const p of pairs) {
        const [key, value] = p.split("=");
        if (!key) continue;
        result[decodeURIComponent(key)] = decodeURIComponent(value || "");
      }
      return result;
    }

    (async function () {
      const root = document.getElementById("root");
      const q = parseQuery();

      // Gọi API xác nhận giao dịch từ backend
      // Gọi API xác nhận giao dịch từ backend
const API_BASE = "https://nonenforced-dixie-nonprovincially.ngrok-free.dev/api/Payment";
let backendResponse = null;
let isSuccess = false;

  try {
    // IMPORTANT: forward the exact query string MoMo sent (like ?errorCode=...&amount=...&extraData=...)
    const queryString = location.search || ""; // includes leading '?', or empty

    const res = await fetch(`${API_BASE}${queryString}`, {
      method: "GET",
    });

    // Try to parse JSON even if server sets a non-json content-type (some endpoints return JSON with text/html)
    let textBody = null;
    try {
      // Prefer json() but fall back to text and try JSON.parse
      backendResponse = await res.json();
    } catch (e) {
      // json() failed — try reading text and parse if possible
      try {
        textBody = await res.text();
        // try to locate JSON inside HTML (common when server renders an HTML page that contains JSON payload)
        const maybeJson = (function () {
          // direct JSON
          try { return JSON.parse(textBody); } catch {}
          // try to find a JSON object in the HTML
          const m = textBody.match(/\{\s*"orderId"[\s\S]*\}/m);
          if (m) {
            try { return JSON.parse(m[0]); } catch {}
          }
          return null;
        })();
        if (maybeJson) backendResponse = maybeJson;
      } catch (e2) {
        console.warn('Failed to read backend text response', e2);
      }
    }

    // If we still don't have backendResponse, build a fallback using query params and optionally the raw text body
    if (!backendResponse) {
      const sp = new URLSearchParams(queryString);
      backendResponse = {
        orderId: sp.get('extraData') || sp.get('orderId') || sp.get('orderid') || '-',
        amount: sp.get('amount') || '',
        message: textBody ? `Backend returned non-JSON response. See console.` : `No response body from backend.`,
      };
      if (textBody) backendResponse._raw = textBody;
    }

  // determine success from backendResponse.message (fallback to MoMo message if not present)
  let msg = (backendResponse?.message || (new URLSearchParams(queryString)).get("message") || "").toString();
  isSuccess = /success|thành công|ok/i.test(msg);

  // If backend returned non-JSON HTML (we logged that earlier) but the DB was updated,
  // try to fetch the order directly to confirm payment status.
  try {
    const looksLikeHtmlResponse = typeof backendResponse?.message === 'string' && backendResponse.message.toLowerCase().includes('html');
    const orderIdFromPayload = backendResponse?.orderId || (new URLSearchParams(queryString)).get('extraData') || (new URLSearchParams(queryString)).get('orderId') || (new URLSearchParams(queryString)).get('orderid');
    if (!isSuccess && looksLikeHtmlResponse && orderIdFromPayload) {
      try {
        const apiOrigin = new URL(API_BASE).origin; // e.g. https://...ngrok-free.dev
        const orderUrl = `${apiOrigin}/api/Order/${encodeURIComponent(orderIdFromPayload)}`;
        const orderRes = await fetch(orderUrl, { method: 'GET' });
        if (orderRes.ok) {
          const orderJson = await orderRes.json().catch(() => null);
          if (orderJson) {
            // Use order info as payload and derive payment success from order.payment.status
            backendResponse = orderJson;
            msg = orderJson?.payment?.message || orderJson?.message || msg;
            const payStatus = orderJson?.payment?.status;
            // 2 usually means Paid in our system
            if (typeof payStatus !== 'undefined') {
              isSuccess = Number(payStatus) === 2 || Number(payStatus) === 1; // treat Authorized/ Paid as success
            } else if (orderJson?.status) {
              // fallback: treat certain order status as success
              isSuccess = [2,3,4,5].includes(Number(orderJson.status));
            }
          }
        }
      } catch (e) {
        console.warn('Order lookup failed', e);
      }
    }
  } catch (e) { console.warn(e); }

} catch (err) {
  console.error("❌ Lỗi xác nhận backend:", err);
  backendResponse = { orderId: (new URLSearchParams(location.search)).get("extraData") || "-", amount: (new URLSearchParams(location.search)).get("amount") || "", message: "Lỗi gọi backend. Xem console." };
}

          const payload = backendResponse || {
            orderId: q.orderId || q.orderid || "-",
            amount: q.amount || "",
            orderInfo: q.orderInfo || q.orderinfo || "",
            message: q.message || "",
          };

      // Hiển thị kết quả
      root.innerHTML = `
        <div class="status">
          <div style="font-size:36px">${isSuccess ? "✅" : "❌"}</div>
          <div>
            <div style="font-size:20px; font-weight:800; color:${
              isSuccess ? "#27c16b" : "#ff6b6b"
            }">${isSuccess ? "Thanh toán thành công" : "Thanh toán thất bại"}</div>
            <div class="muted" style="margin-top:6px">${payload.message || "Không có thông báo"}</div>
          </div>
        </div>
        <div style="margin-top:16px">
          <div><strong>Mã đơn hàng:</strong> ${payload.orderId}</div>
          <div><strong>Số tiền:</strong> ${
            payload.amount
              ? Number(payload.amount).toLocaleString("vi-VN") + " đ"
              : "-"
          }</div>
          <div><strong>Nội dung:</strong> ${payload.orderInfo || "-"}</div>
        </div>
        <pre style="margin-top:12px">${JSON.stringify(payload, null, 2)}</pre>
        <div class="actions">
          <button class="btn btn-primary" id="openApp">Mở trong ứng dụng</button>
          <button class="btn btn-outline" id="backShop">Về cửa hàng</button>
        </div>
      `;

      document.getElementById("openApp").addEventListener("click", () => {
        const encoded = encodeURIComponent(JSON.stringify(payload));
        location.href = "flowerfly://payment/result?response=" + encoded;
      });

      document.getElementById("backShop").addEventListener("click", () => {
        location.href = "/Frontend/index.html";
      });

      // Gửi kết quả về app sau 1.5 giây nếu thành công
      if (isSuccess) {
        setTimeout(() => {
          try {
            const encoded = encodeURIComponent(JSON.stringify(payload));
            location.href = "flowerfly://payment/result?response=" + encoded;
          } catch {}
        }, 1500);
      }

      // Xóa query khỏi URL (tránh reload lỗi)
      if (window.history.replaceState) {
        history.replaceState({}, document.title, window.location.pathname);
      }
    })();
  </script>
</body>
</html>
