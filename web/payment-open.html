<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mở liên kết thanh toán</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 24px; background:#f6faf7; color:#203a2f }
    .card { max-width:720px; margin:28px auto; background:#fff; padding:18px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.06) }
    label { display:block; margin-top:8px; font-weight:600 }
    input, textarea { width:100%; padding:8px; margin-top:6px; border:1px solid #e6eee9; border-radius:8px }
    .actions { margin-top:12px; display:flex; gap:8px }
    .btn { padding:10px 14px; border-radius:8px; border:0; cursor:pointer }
    .btn-primary { background:#27c16b; color:#fff }
    .btn-plain { background:#fff; border:1px solid #e6eee9 }
    .muted { color:#6b8f80; margin-top:8px }
  </style>
</head>
<body>
  <div class="card">
    <h2>Mở liên kết thanh toán</h2>
    <p class="muted">
      Nhập tham số bên dưới rồi bấm "Mở API Payment" để mở URL:
      <code>https://nonenforced-dixie-nonprovincially.ngrok-free.dev/api/Payment</code>
    </p>

    <form id="frm">
      <label for="orderId">orderId / extraData</label>
      <input id="orderId" name="orderId" placeholder="order123" />

      <label for="amount">amount</label>
      <input id="amount" name="amount" placeholder="100000" />

      <label for="orderInfo">orderInfo</label>
      <input id="orderInfo" name="orderInfo" placeholder="Mua hoa" />

      <label for="fullName">fullName</label>
      <input id="fullName" name="fullName" placeholder="Nguyen Van A" />

      <div class="actions">
        <button type="submit" class="btn btn-primary">Mở API Payment</button>
        <button type="button" id="openNew" class="btn btn-plain">Mở trong tab mới</button>
      </div>
    </form>

    <div class="muted">
      Bạn cũng có thể gọi trang này với query string để tự động mở, ví dụ:
      <code>payment-open.html?orderId=123&amp;amount=100000</code>
    </div>
  </div>

  <script>
    const API_BASE = 'https://nonenforced-dixie-nonprovincially.ngrok-free.dev/api/Payment';

    function serialize(obj) {
      return Object.entries(obj)
        .filter(([k, v]) => v !== undefined && v !== null && String(v) !== '')
        .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(String(v)))
        .join('&');
    }

    function buildPayloadFromForm() {
      const form = document.getElementById('frm');
      return {
        extraData: form.orderId.value || '',
        amount: form.amount.value || '',
        orderInfo: form.orderInfo.value || '',
        fullName: form.fullName.value || '',
      };
    }

    function openPaymentUrl(url, openInNewTab = false) {
      if (openInNewTab) {
        window.open(url, '_blank');
      } else {
        location.href = url;
      }
    }

    function openPaymentFromForm(openInNewTab = false) {
      const payload = buildPayloadFromForm();
      const qs = serialize(payload);
      const url = `${API_BASE}${qs ? '?' + qs : ''}`;
      openPaymentUrl(url, openInNewTab);
    }

    // form event handlers
    document.getElementById('frm').addEventListener('submit', (e) => {
      e.preventDefault();
      openPaymentFromForm(false);
    });
    document.getElementById('openNew').addEventListener('click', () => {
      openPaymentFromForm(true);
    });

    // Auto open if query string already present (giống payment-return.html)
    (function autoOpenFromQuery() {
      const queryString = location.search || '';
      if (!queryString || queryString === '?') return;

      // mở API Payment với nguyên query string
      const url = `${API_BASE}${queryString}`;
      console.log('Auto opening payment URL:', url);

      setTimeout(() => openPaymentUrl(url, false), 400);
    })();
  </script>
</body>
</html>
